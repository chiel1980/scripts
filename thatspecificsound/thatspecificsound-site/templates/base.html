<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site_tagline }}{% endblock %}">
<meta name="color-scheme" content="dark">
<link rel="icon" href="{{ path_prefix|default('') }}static/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ path_prefix|default('') }}static/css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ path_prefix|default('') }}index.html">
      <span class="brand__mark" aria-hidden="true">
        <svg class="brand__wave" viewBox="0 0 28 14" preserveAspectRatio="none">
          <path d="M0,7 Q3.5,2 7,7 Q10.5,12 14,7 Q17.5,2 21,7 Q24.5,12 28,7" fill="none" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">That Specific Sound</span>
        <span class="brand__sub">Guitar rigs of hardcore &amp; metal</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav class="site-nav" id="primary-nav" aria-label="Primary">
      <ul>
        {% for item in nav %}
        <li><a href="{{ path_prefix|default('') }}{{ item.href }}"{% if item.label == active %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<main id="main-content">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__archive">{{ site_tagline }}</p>
    <p class="site-footer__meta">&copy; {{ generated_at[-4:] }} That Specific Sound &middot; last updated {{ generated_at }} &middot; <a href="{{ path_prefix|default('') }}changes.html">What's new</a></p>
  </div>
</footer>

<script src="{{ path_prefix|default('') }}static/js/main.js"></script>
</body>
</html>
